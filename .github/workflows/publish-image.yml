name: Publish and deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set image name
              run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/abdspace-ops" >> "$GITHUB_ENV"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_NAME }}:latest
                      ${{ env.IMAGE_NAME }}:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Update Dokploy image
              env:
                  DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
                  DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
                  DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
                  OPS_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
              run: |
                  CURRENT=$(curl --fail-with-body \
                    "${DOKPLOY_URL}/api/compose.one?composeId=${DOKPLOY_COMPOSE_ID}" \
                    -H "x-api-key: ${DOKPLOY_API_KEY}")

                  CURRENT_ENV=$(echo "$CURRENT" | jq -r '.env // ""')

                  UPDATED_ENV=$(printf '%s\n' "$CURRENT_ENV" | awk -v image="$OPS_IMAGE" '
                    BEGIN { found = 0 }
                    /^OPS_IMAGE=/ {
                      print "OPS_IMAGE=" image
                      found = 1
                      next
                    }
                    { print }
                    END {
                      if (!found) print "OPS_IMAGE=" image
                    }
                  ')

                  jq -n \
                    --arg composeId "$DOKPLOY_COMPOSE_ID" \
                    --arg env "$UPDATED_ENV" \
                    '{composeId: $composeId, env: $env}' \
                    | curl --fail-with-body \
                        -X POST "${DOKPLOY_URL}/api/compose.saveEnvironment" \
                        -H "Content-Type: application/json" \
                        -H "x-api-key: ${DOKPLOY_API_KEY}" \
                        --data-binary @-

            - name: Deploy to Dokploy
              run: curl --fail-with-body --request POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
